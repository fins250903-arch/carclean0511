backend:
  name: github
  repo: fins250903-arch/carclean0511
  branch: main
  base_url: https://carinteriorcleaning.jp
  auth_endpoint: api/auth

media_folder: public/posts
public_folder: /posts

locale: ja

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

collections:
  - name: blog
    label: ブログ記事
    label_singular: ブログ記事
    folder: src/content/blog
    path: '{{year}}/{{month}}/{{slug}}/index'
    slug: '{{year}}-{{month}}-{{day}}-{{shortSlug}}'
    extension: md
    format: frontmatter
    create: true
    delete: true
    summary: '{{date}} — {{title}}'
    sortableFields: ['date', 'title']
    fields:
      - label: 公開日
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        default: '{{now}}'
        required: true

      - label: タイトル（SEO・32文字目安）
        name: title
        widget: string
        required: true

      - label: URL用スラッグ（英字のみ）
        name: shortSlug
        widget: string
        required: true
        hint: '例: trucksaitama'
        pattern: ['^[a-z0-9-]+$', '英数字とハイフンのみ']

      - label: 地域名称（都道府県＋市区町村）
        name: areaName
        widget: string
        required: false
        hint: '新規記事では必ず入力してください。例: 愛知県あま市、神奈川県横浜市西区 — 都道府県から書くと地区LPの施工実例へ自動掲載されます'

      - label: サムネイル画像
        name: coverImage
        widget: image
        required: false

      - label: 'AIO要約（記事冒頭の結論・空欄は本文から自動生成）'
        name: 'summary'
        widget: 'object'
        summary: 'Answer-First（結論）'
        collapsed: false
        fields:
          - {
              label: '結論文（Answer-First・120〜160文字）',
              name: 'answer_first',
              widget: 'text',
              required: false,
              hint: '空欄でOK。未入力の場合は「エリア・お悩み・施工内容・作業時間・費用」から自動生成されます。手入力する場合は「どこで・何を・どう直し・いくらかかったか」の順で書いてください'
            }
          - {
              label: '車種',
              name: 'car_model',
              widget: 'string',
              required: false,
              hint: '例: トヨタ エスティマ、メルセデス Cクラス'
            }
          - {
              label: 'お悩み・トラブル内容',
              name: 'trouble',
              widget: 'string',
              required: false,
              hint: '空欄なら本文から自動判定。例: 嘔吐（ゲロ）汚れとニオイ、おもらし・尿の染み込み'
            }
          - {
              label: '施工内容',
              name: 'method',
              widget: 'string',
              required: false,
              hint: '空欄なら本文から自動判定。例: 業務用リンサーの温水抽出洗浄＋オゾン消臭'
            }
          - {
              label: '作業時間',
              name: 'work_time',
              widget: 'string',
              required: false,
              hint: '例: 約3時間 — 本文に「作業時間：3時間」と書けば自動抽出されます'
            }
          - {
              label: '費用（税込）',
              name: 'price',
              widget: 'string',
              required: false,
              hint: '例: 28,000円 — 本文に「費用：28,000円」と書けば自動抽出されます'
            }

      - label: "SEO対策（検索エンジン用設定）"
        name: "seo"
        widget: "object"
        summary: "SEO設定"
        fields:
          - {
              label: "メタ・タイトル（未入力時は上記タイトルを使用）",
              name: "meta_title",
              widget: "string",
              required: false,
              hint: "検索結果に表示されるタイトルです（推奨：30〜35文字）"
            }
          - {
              label: "メタ・ディスクリプション（記事の要約）",
              name: "meta_description",
              widget: "text",
              required: false,
              hint: "検索結果の解説文です（推奨：120文字前後・160文字以内）。本文の途中を貼り付けず、結論を要約してください。空欄または160文字超の場合は上記のAnswer-First結論文が自動で使われます"
            }
          - {
              label: "主要キーワード（フォーカスキーワード）",
              name: "keywords",
              widget: "string",
              required: false,
              hint: "この記事で狙うSEOキーワード（カンマ区切り：例 Astro, SEO, ブログ）"
            }
          - {
              label: "インデックス拒否（noindex）",
              name: "noindex",
              widget: "boolean",
              default: false,
              hint: "チェックを入れると、検索エンジンにインデックスされなくなります（下書きや低品質ページの隠蔽用）"
            }

      - label: "SNS・マーケティング設定（OGP）"
        name: "ogp"
        widget: "object"
        summary: "SNSシェア設定"
        fields:
          - {
              label: "アイキャッチ・OGP画像",
              name: "og_image",
              widget: "image",
              required: false,
              hint: "X（旧Twitter）やFacebookでシェアされた際に表示される画像です"
            }
          - {
              label: "記事のタイプ",
              name: "og_type",
              widget: "select",
              options: ["article", "website"],
              default: "article"
            }

      - label: 本文
        name: body
        widget: markdown
        required: true
        hint: '見出し（##）を残したまま書き換えてください。AIと検索エンジンが「費用」「作業時間」を抜き出せる形式です'
        default: |
          ## ご相談内容

          （いつ・どこで・何が起きたか。お客様の言葉をそのまま書くと強い記事になります）

          ## 現車確認でわかったこと

          （汚れの範囲・染み込みの深さ・素材。写真で伝わらない判断根拠を書きます）

          ## 実際の作業

          （使用した機材と洗浄剤、手順、気をつけた点）

          ## 作業時間と費用

          作業時間：3時間 / 費用：28,000円

          ## お客様の声・仕上がり

          （お客様の反応、シート交換を避けられた等の結果）
